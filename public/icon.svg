<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#be185d"/>
      <stop offset="100%" style="stop-color:#9d174d"/>
    </linearGradient>
    <linearGradient id="ring1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fde68a"/>
      <stop offset="100%" style="stop-color:#f59e0b"/>
    </linearGradient>
    <linearGradient id="ring2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fde68a"/>
      <stop offset="100%" style="stop-color:#d97706"/>
    </linearGradient>
    <linearGradient id="diamond" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="50%" style="stop-color:#e0f2fe"/>
      <stop offset="100%" style="stop-color:#bae6fd"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000040"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Subtle pattern -->
  <circle cx="80" cy="80" r="120" fill="#ffffff08"/>
  <circle cx="432" cy="432" r="140" fill="#ffffff06"/>

  <!-- Left ring -->
  <ellipse cx="215" cy="290" rx="75" ry="78" fill="none" stroke="url(#ring1)" stroke-width="18" filter="url(#shadow)"/>
  <ellipse cx="215" cy="290" rx="75" ry="78" fill="none" stroke="#fef3c7" stroke-width="4" opacity="0.5"/>

  <!-- Right ring (interlocked) -->
  <ellipse cx="297" cy="290" rx="75" ry="78" fill="none" stroke="url(#ring2)" stroke-width="18" filter="url(#shadow)"/>
  <ellipse cx="297" cy="290" rx="75" ry="78" fill="none" stroke="#fef3c7" stroke-width="4" opacity="0.5"/>

  <!-- Interlock overlay - hide back of right ring behind left -->
  <clipPath id="leftClip">
    <rect x="230" y="212" width="50" height="78"/>
  </clipPath>
  <ellipse cx="215" cy="290" rx="75" ry="78" fill="none" stroke="url(#ring1)" stroke-width="18" clip-path="url(#leftClip)"/>

  <!-- Diamond on left ring -->
  <g transform="translate(215, 200)" filter="url(#glow)">
    <polygon points="0,-22 18,0 0,10 -18,0" fill="url(#diamond)" stroke="#e0f2fe" stroke-width="1.5"/>
    <polygon points="0,-22 18,0 0,0" fill="#bae6fd" opacity="0.3"/>
    <!-- Sparkles -->
    <line x1="-25" y1="-18" x2="-18" y2="-14" stroke="white" stroke-width="2.5" stroke-linecap="round" opacity="0.9"/>
    <line x1="25" y1="-20" x2="19" y2="-15" stroke="white" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
    <line x1="-10" y1="-35" x2="-6" y2="-27" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    <circle cx="28" cy="-30" r="2" fill="white" opacity="0.8"/>
    <circle cx="-28" cy="-5" r="1.5" fill="white" opacity="0.6"/>
  </g>

  <!-- C & P text -->
  <text x="256" y="440" text-anchor="middle" font-family="Georgia, serif" font-size="52" font-weight="bold" fill="white" opacity="0.95" letter-spacing="4">C &amp; P</text>

  <!-- Small hearts decoration -->
  <g opacity="0.25" fill="white">
    <path d="M100,160 C100,150 112,145 118,152 C124,145 136,150 136,160 C136,172 118,182 118,182 C118,182 100,172 100,160Z" transform="scale(0.7) translate(60,30)"/>
    <path d="M100,160 C100,150 112,145 118,152 C124,145 136,150 136,160 C136,172 118,182 118,182 C118,182 100,172 100,160Z" transform="scale(0.5) translate(700,60)"/>
    <path d="M100,160 C100,150 112,145 118,152 C124,145 136,150 136,160 C136,172 118,182 118,182 C118,182 100,172 100,160Z" transform="scale(0.45) translate(150,180)"/>
  </g>
</svg>
